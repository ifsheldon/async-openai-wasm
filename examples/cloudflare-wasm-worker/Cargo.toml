[package]
name = "cloudflare-wasm-worker"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

# https://github.com/rustwasm/wasm-pack/issues/1247
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
async-openai-wasm = {path = "../../async-openai-wasm" }

[profile.release]
lto = true
strip = true
codegen-units = 1
